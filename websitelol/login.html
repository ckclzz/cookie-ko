<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Cookie 'Ko | Login </title>
        <style>
          body{
            background-color: rgb(251, 242, 233);
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
          }
        .register{
            text-align: center;
        }
        .things{
            color: rgb(68, 35, 14);
            font-family: cursive;
            font-size: 22px;
        }
        .form{
            border:2px solid  rgb(68, 35, 14);
            padding: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40vw;;
            height: 35vw;
            border-radius: 6.7px;
            font-size: 20px;
            gap: 20px;
            background-color:  rgb(251, 226, 199);
            position: absolute;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
        }
        .form input,
        .form select{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 18px;
        }
        .form input[type="submit"]{
            padding: 8px 18px;
            border: 0;
            border-radius: 6px;
            color: rgb(68, 35, 14);
            font-family: cursive;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .bbox{
            display: flex;
            width: 100%;
        }
        .box{
            width: 100%;
            padding: 20px;
            display: flex;

        }
        .logo
        {
            z-index: 1;
            animation-name: logoback;
            animation-duration: 500ms;
            animation-delay: 0s;
            position: absolute;
            width: 10vw;
            top: 0;
            left: 0%;
        }
         @keyframes logomation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes logoback {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }
        .logo:hover {
            animation-name: logomation;
            animation-duration: 500ms;
            animation-delay: 0s;
        }
.login-options {
    width: 77%;
    margin: 5px auto 25px;
    margin-left: 20%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 16px;
}

.remember {
    display: flex;
    align-items: center;
    gap: 7px;
    color: rgb(68, 35, 14);
    cursor: pointer;
}

.remember input {
    width: 16px;
    height: 16px;
    accent-color: rgb(122, 84, 46);
    cursor: pointer;
}

.forgot {
    color: rgb(68, 35, 14);
    text-decoration: none;
    font-size: 16px;
}

.forgot:hover {
    text-decoration: underline;
    color: rgb(122, 84, 46);
}

        </style>
    </head>
    <body>
      <br>
      <br>
      <br>
      <br>

<div class="form">

  <img src="images/cookie.png"alt="cookie"title="cookie" class="logo">
        <h3 style="text-align: center; color:rgb(0, 0, 0); font-family: cursive; font-size: 34px; margin-top: 1px;"> Welcome back </h3>
        <br>
        <form action="home.html" method="get" class="register">
<div class="bbox">
<div class="box">
            <label for="username" class="things">Username:</label><br>
            <input type="text" id="username" name="username" required style="width: 100%; position: relative;"> <br><br>
</div>
</div>
<br>
<div class="bbox">
<div class="box">
            <label for="password" class="things">Password:</label><br>
            <input type="password" id="password" name="password" required style="width: 100%; position: relative;"> <br><br>   
</div>
</div>



<div class="login-options">
    <label class="remember">
        <input type="checkbox" name="remember" value="yes">
        <span>Stay Logged In</span>
    </label>

    <a href="forgot.html" class="forgot">
        Forgot Password?
    </a>
</div>


<br>
<br>


<input type="submit" value="Login" style="background-color: rgb(167, 116, 64);left: 50%; color: white; width: 95%;">


<br>


<p style="position: relative;">No account? <a href="website1.html" style="text-decoration:none; color: blue;">register now</a></p>
</div>
        </form>
        </div>
    </body>
</html>
