<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Cookie 'Ko | Registration </title>
        <style>
        
        .things{
            color: white;
            font-family: cursive;
            font-size: 22px;
        }
        .form{
            border:2px solid  rgb(68, 35, 14);
            padding: 15px;
            margin: 10px;
            width: 60vw;
            height: 42vw;
            border-radius: 6.7px;
            font-size: 20px;
            gap: 20px;
            background-color:  rgb(122, 84, 46);
        }
        .form input,
        .form select{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 18px;
        }
        .form input[type="submit"]{
            padding: 8px 18px;
            border: 0;
            border-radius: 6px;
            color: rgb(68, 35, 14);
            font-family: cursive;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .register {
            text-align: left;
        }

        .bbox {
            display: flex;
            width: 100%;
        }

        .box {
            width: 50%;
            padding: 20px;
            box-sizing: border-box;
        }


        
        .logo
        {
            z-index: 1;
            animation-name: logoback;
            animation-duration: 500ms;
            animation-delay: 0s;
        }
         @keyframes logomation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes logoback {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }
        .logo:hover {
            animation-name: logomation;
            animation-duration: 500ms;
            animation-delay: 0s;


        }
        </style>
    </head>
    <body style="background-color: rgb(252, 239, 225) ; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">
<div class="form" style="float: left;">
        <h3 style="text-align: center; color:rgb(255, 255, 255); font-family: cursive; font-size: 34px; margin-top: 1px;"> CREATE AN ACCOUNT </h3>
        <form action="home.html" method="get" class="register">
<div class="bbox">
<div class="box">
            <label for="Fname" class="things">First Name:</label> <br>
            <input type="text" id="Fname" name="Fname" required style="width: 100%;"> <br><br>
</div>
<div class="box">
            <label for="Lname" class="things">Last Name:</label> <br>
            <input type="text" id="Lname" name="Lname" required style="width: 100%;"> <br><br>
</div>
</div>
<div class="bbox">
<div class="box">
            <label for="username" class="things">Username:</label><br>
            <input type="text" id="username" name="username" required style="width: 100%;"> <br><br>
</div>
<div class="box">
            <label for="email" class="things">Email:</label><br>
            <input type="email" id="email" name="email" required style="width: 100%;"> <br><br>
</div>
</div>
<div class="bbox">
<div class="box">
            <label for="number" class="things">Phone Number:</label><br>
            <input type="number" id="number" name="number" required style="width: 100%;"> <br><br>   
</div>
<div class="box">
            <label for="dob" class="things">Date Of Birth:</label><br>
            <input type="date" id="dob" name="dob" required style="width: 100%;"> <br><br>   
</div>
</div>
<div class="bbox">
<div class="box">
            <label for="gender" class="things">Gender:</label><br>
            <select id="gender" name="gender" required style="width: 100%;">
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select> <br><br>   
</div>
<div class="box">
            <label for="password" class="things">Password:</label><br>
            <input type="password" id="password" name="password" required style="width: 100%;"> <br><br>   
</div>
</div>
<input type="submit" value="Register" style="background-color: white; left: 50%; transform: translateX(-50%); position: relative;">

<p style="color: white; text-align: center;">
    Already Have an Account? <a href="login.html" style="text-decoration: none;color: rgb(0, 128, 255);"> login </a>
</p>

</form>
</div>

        <img src="images/cookie.png"alt="cookie"title="cookie"float="right" class="logo">
        <p style="color: rgb(68, 35, 14)"> ang cookie ay cookie mo dahil cookie ko kahit cookie natin lahat ay cookie para sayo. <br><br> dahil sa cookie ay magiging cookie ngunit subalit dadapwat tayo ay magiging cookie din para sa ating mga cookie na masarap. </p>
    </body>
</html>
